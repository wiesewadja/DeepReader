name: deepreader-implement
description: |
  全自动特性实现工作流。在已有 worktree 分支上（含 SPEC.md + tasks/plan.md），
  自动实现、构建、测试、审查、部署到 test-vault。
  Triggers: "实现特性", "implement", "跑实现", "build feature"。

  用法（续接 deepreader-spec 的 worktree）：
    archon continue feat/<name> --workflow deepreader-implement
  或（独立使用，需已有 SPEC 或 plan）：
    archon workflow run deepreader-implement --branch feat/<name>
provider: claude
model: sonnet
worktree:
  enabled: false

nodes:
  # ── Phase 1: 检测输入 ──
  - id: detect-input
    bash: |
      if [ -f "tasks/plan.md" ]; then
        echo "plan"
      elif [ -f "SPEC.md" ]; then
        echo "spec"
      else
        echo "none"
      fi

  - id: cancel-no-input
    cancel: "未找到 tasks/plan.md 或 SPEC.md，无法继续。请先运行 deepreader-spec 工作流。"
    depends_on: [detect-input]
    when: "$detect-input.output == 'none'"

  # ── Plan 生成（仅 spec 模式需要）─────────────────────────────
  - id: generate-plan-from-spec
    command: dr-generate-plan
    depends_on: [detect-input]
    when: "$detect-input.output == 'spec'"
    context: fresh

  - id: approve-plan
    approval:
      message: "tasks/plan.md 已生成。请审查，确认后开始实现。"
      capture_response: true
      on_reject:
        prompt: "根据反馈修改 tasks/plan.md：$REJECTION_REASON"
        max_attempts: 5
    depends_on: [generate-plan-from-spec]
    when: "$detect-input.output == 'spec'"

  # ── Phase 2: 逐任务实现 ──
  - id: implement
    loop:
      prompt: |
        调用 agent-skills:build 技能（使用 Skill 工具），按增量实现模式工作。

        每次迭代：
        1. 读取 tasks/plan.md，找到第一个未勾选的验收标准
        2. 调用 agent-skills:incremental-implementation 技能实现该任务
        3. 实现后标记该任务为已完成
        4. 将变更摘要写入 $ARTIFACTS_DIR/changes.md

        代码规范（参考 CLAUDE.md 和 .project-rules/）：
        - TypeScript strictNullChecks
        - 纯 DOM API + Obsidian createEl，不使用 React/Vue
        - 使用 src/utils/logger.ts 按模块记录日志
        - 文件操作通过 Vault API，不硬编码路径
        - 中文注释业务逻辑，英文标识符

        当所有任务完成时，输出 <promise>COMPLETE</promise>
      until: COMPLETE
      max_iterations: 30
      fresh_context: true
      until_bash: "npm run build && npm run test:run"
    depends_on: [approve-plan, detect-input]
    trigger_rule: none_failed_min_one_success

  # ── Phase 3: 代码审查 ──
  - id: review
    command: dr-review-code
    depends_on: [implement]
    context: fresh

  # ── Phase 4: 自动修复 ──
  - id: auto-fix
    loop:
      prompt: |
        调用 agent-skills:code-simplify 技能（使用 Skill 工具），对修复后的代码进行简化。

        以下是代码审查发现的问题：

        $review.output

        修复所有 CRITICAL 和 HIGH 级别问题。
        每修复一个问题，简要记录到 $ARTIFACTS_DIR/fixes.md。
        修复完成后输出 <promise>COMPLETE</promise>。

        如果审查结果为 REVIEW_PASSED，直接输出 <promise>COMPLETE</promise>。
      until: COMPLETE
      max_iterations: 3
      fresh_context: true
      until_bash: "npm run build && npm run test:run"
      idle_timeout: 600000
    depends_on: [review]

  # ── Phase 5: 部署 ──
  - id: deploy
    bash: "npm run deploy"
    depends_on: [auto-fix]
