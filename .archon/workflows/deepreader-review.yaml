name: deepreader-review
description: |
  自动化代码审查工作流。构建 → 五轴审查 → 自动修复 → 测试验证。
  结合 e2e-light 和 smoke 测试，确保变更不引入回归。
  Triggers: "审查代码", "review", "代码审查", "跑审查"。

  用法：
    archon workflow run deepreader-review --branch feat/<name>
  或（审查当前分支）：
    archon workflow run deepreader-review --no-worktree ""

provider: claude
model: sonnet
interactive: true

nodes:
  # ── Phase 1: 收集变更上下文（含完整 diff）──
  - id: gather-changes
    bash: |
      mkdir -p "$ARTIFACTS_DIR"
      {
        echo "# 变更摘要"
        echo ""
        echo "## 分支"
        git branch --show-current
        echo ""
        echo "## 相对 main 的变更文件"
        git diff --name-status origin/main...HEAD 2>/dev/null || git diff --name-status HEAD~1...HEAD
        echo ""
        echo "## Diff 统计"
        git diff --stat origin/main...HEAD 2>/dev/null || git diff --stat HEAD~1...HEAD
        echo ""
        echo "## 最近 10 次提交"
        git log --oneline -10
        echo ""
        echo "---"
        echo ""
        echo "## 完整 Diff（限 5000 行）"
        git diff origin/main...HEAD 2>/dev/null | head -5000 || git diff HEAD~1...HEAD | head -5000
      } > "$ARTIFACTS_DIR/changes.md"
      LINES=$(wc -l < "$ARTIFACTS_DIR/changes.md")
      echo "Context: ${LINES} lines → $ARTIFACTS_DIR/changes.md"

  # ── Phase 2: 并行构建 + 类型检查 + 测试 ──
  - id: build
    bash: "npm run build 2>&1 | tail -20"
    depends_on: [gather-changes]
    timeout: 120000

  - id: typecheck
    bash: "npx tsc --noEmit 2>&1 | tail -20"
    depends_on: [gather-changes]
    timeout: 60000

  - id: unit-tests
    bash: "npm run test:run 2>&1 | tail -15"
    depends_on: [gather-changes]
    timeout: 180000

  # ── Phase 3: 五轴代码审查（不依赖测试结果）──
  - id: review
    command: dr-review-code
    depends_on: [gather-changes]
    context: fresh

  # ── Phase 4: 构建产物审查 ──
  - id: check-bundle
    bash: |
      {
        echo "# 构建产物检查"
        echo ""
        if [ -f bin/main.js ]; then
          SIZE=$(wc -c < bin/main.js)
          LINES=$(wc -l < bin/main.js)
          echo "bin/main.js: ${SIZE} bytes, ${LINES} lines"
          if [ "$SIZE" -gt 2000000 ]; then
            echo "⚠️  超过 2MB 阈值"
          else
            echo "✅ 体积正常"
          fi
        else
          echo "⚠️  bin/main.js 不存在"
        fi
      } > "$ARTIFACTS_DIR/bundle-check.md"
      cat "$ARTIFACTS_DIR/bundle-check.md"
    depends_on: [build]
    trigger_rule: none_failed_min_one_success

  # ── Phase 5: 汇总审查结果 ──
  - id: synthesize
    prompt: |
      你是审查结果汇总 agent。综合以下信息生成一份结构化报告：

      ## 代码审查结果（核心）
      $review.output

      ## 构建产物检查
      $check-bundle.output

      ## 类型检查
      $typecheck.output

      ## 单元测试
      $unit-tests.output

      ## 输出格式

      ### 审查结论: PASS / NEEDS_FIX / BLOCKED

      按严重程度列出所有问题：
      - **CRITICAL**: 必须修复才能合并
      - **HIGH**: 强烈建议修复
      - **MEDIUM**: 改进建议
      - **LOW**: 可选优化

      每个问题包含：文件路径:行号、问题描述、建议修复。
      如果所有检查都通过，输出 "REVIEW_PASSED"。

      将报告写入 `$ARTIFACTS_DIR/review-report.md`。
    depends_on: [review, check-bundle, typecheck, unit-tests]
    trigger_rule: all_done

  # ── Phase 6: 自动修复 CRITICAL / HIGH ──
  - id: auto-fix
    loop:
      prompt: |
        你是代码修复 agent。根据审查报告修复 CRITICAL 和 HIGH 级别问题。

        读取 `$ARTIFACTS_DIR/review-report.md` 获取审查结果。
        读取 `$ARTIFACTS_DIR/changes.md` 获取变更上下文。

        修复所有 CRITICAL 和 HIGH 级别问题。
        每修复一个问题，简要记录到 `$ARTIFACTS_DIR/fixes.md`。

        修复完成后运行 `npm run build && npm run test:run` 验证。
        验证通过后输出 <promise>COMPLETE</promise>。
        如果审查结果为 REVIEW_PASSED，直接输出 <promise>COMPLETE</promise>。
      until: COMPLETE
      max_iterations: 3
      fresh_context: true
      until_bash: "npm run build && npm run test:run"
      idle_timeout: 600000
    depends_on: [synthesize]

  # ── Phase 7: Smoke + E2E-Light 回归测试（并行）──
  - id: smoke-test
    bash: "npm run smoke:core 2>&1 | tail -30"
    depends_on: [auto-fix]
    timeout: 180000

  - id: e2e-light
    bash: "npm run e2e-light 2>&1 | tail -30"
    depends_on: [auto-fix]
    timeout: 300000

  # ── Phase 8: 最终报告 ──
  - id: final-report
    prompt: |
      生成最终审查报告，汇总所有阶段的结果：

      1. 读取 `$ARTIFACTS_DIR/review-report.md`（代码审查结论）
      2. 读取 `$ARTIFACTS_DIR/fixes.md`（自动修复记录，如存在）
      3. Smoke 测试结果: $smoke-test.output
      4. E2E-Light 测试结果: $e2e-light.output

      输出一份简洁的最终报告到 `$ARTIFACTS_DIR/final-report.md`：
      - 审查结论（PASS / FIXED / BLOCKED）
      - 发现的问题数量（按级别）
      - 已修复的问题
      - 剩余需人工处理的问题
      - 测试结果摘要
      - 建议的下一步操作
    depends_on: [smoke-test, e2e-light]
    trigger_rule: all_done
