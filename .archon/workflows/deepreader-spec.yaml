name: deepreader-spec
description: |
  交互式特性规划工作流。从自然语言描述出发，
  通过多轮对话确认用户意图，生成 SPEC.md。
  自动判断使用 interview-me（模糊需求）或 idea-refine（清晰想法）。
  Triggers: "规划特性", "写SPEC", "spec一个功能", "规划一个新特性", "plan feature"。

  用法：archon workflow run deepreader-spec --branch feat/<name> "特性描述"
  后续：archon continue feat/<name> --workflow deepreader-implement
interactive: true
provider: claude
model: sonnet
worktree:
  enabled: false

nodes:
  # ── Phase 1: 探索想法，提出关键问题 ──
  - id: explore
    command: dr-explore-idea

  - id: answer-questions
    approval:
      message: "请回答以上问题，或补充你想到的其他约束。回答后我生成 SPEC 草稿。"
      capture_response: true
    depends_on: [explore]

  # ── Phase 2: 生成 SPEC ──
  - id: write-spec
    command: dr-write-spec
    depends_on: [answer-questions]

  - id: approve-spec
    approval:
      message: "SPEC.md 草稿已生成。请审查，确认后规划流程结束。"
      capture_response: true
      on_reject:
        prompt: "根据反馈修改 SPEC.md：$REJECTION_REASON"
        max_attempts: 5
    depends_on: [write-spec]

