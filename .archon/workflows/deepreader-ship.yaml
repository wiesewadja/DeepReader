name: deepreader-ship
description: |
  合并分支到 main，更新版本日期，部署到 daily 版本。
  Triggers: "合并发布", "ship", "发布到daily", "合并到main"。

  用法：archon continue feat/<name> --workflow deepreader-ship
  或：archon workflow run deepreader-ship --no-worktree "feat/<branch-name>"
interactive: true
provider: claude
model: sonnet
worktree:
  enabled: false

nodes:
  # ── Phase 1: 预览变更 ──
  - id: preview
    command: dr-preview-changes

  - id: approve-merge
    approval:
      message: "以上是将要合并到 main 的全部变更。确认合并吗？"
      capture_response: true
    depends_on: [preview]

  # ── Phase 2: 合并 + 版本更新 ──
  - id: merge-and-version
    command: dr-merge-and-version
    depends_on: [approve-merge]

  # ── Phase 3: 构建 + 部署 daily ──
  - id: build
    bash: "npm run build"
    depends_on: [merge-and-version]

  - id: deploy-daily
    bash: "npm run deploy:daily"
    depends_on: [build]

  # ── Phase 4: 报告结果 ──
  - id: report
    prompt: |
      合并和部署已完成。输出一份简洁的总结报告，包含：
      1. 合并的分支名
      2. 新版本号
      3. 部署目标
      4. 主要变更摘要（读取 $ARTIFACTS_DIR/changes.md）
      5. 提醒用户在 Obsidian 中验证 daily 版本
    depends_on: [deploy-daily]
