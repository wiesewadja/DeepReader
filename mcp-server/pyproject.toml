[project]
name = "deeppdf-mcp-server"
version = "0.1.0"
description = "DeepPDF MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.1.0",
    "chromadb>=0.4.0",
    "pypdf2>=3.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
