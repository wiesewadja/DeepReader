[project]
name = "deeppdf-mcp-server"
version = "0.1.0"
description = "DeepPDF MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.1.0",
    "chromadb>=0.4.0",
    "pypdf2>=3.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.0",
    "tiktoken>=0.5.0",
    "openai>=1.0.0",
    "pymupdf>=1.23.0",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deeppdf"]

[tool.hatch.build]
include = [
  "src/deeppdf/**/*.py"
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
