[project]
name = "deeppdf-mcp-server"
version = "0.1.0"
description = "DeepPDF MCP Server - PDF indexing and query service"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.1.0",
    "orjson>=3.10.0",
    "backoff>=2.2.0",
    "pageindex",  # 依赖 workspace 中的 pageindex
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.uv.sources]
pageindex = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deeppdf"]

[tool.ruff]
target-version = "py310"
line-length = 100
