version: "3.8"

services:
  deeppdf-backend:
    build:
      context: .
      dockerfile: Dockerfile.slim
      target: production
    container_name: deeppdf-backend
    image: deeppdf-backend:slim
    ports:
      - "5088:5088"
    environment:
      # LLM Configuration
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}

      # PDF Indexing Configuration
      - PDF_INDEX_TOC_CHECK_PAGES=${PDF_INDEX_TOC_CHECK_PAGES:-20}
      - PDF_INDEX_MAX_PAGES_PER_NODE=${PDF_INDEX_MAX_PAGES_PER_NODE:-10}
      - PDF_INDEX_MAX_TOKENS_PER_NODE=${PDF_INDEX_MAX_TOKENS_PER_NODE:-20000}
      - PDF_INDEX_IF_ADD_NODE_SUMMARY=${PDF_INDEX_IF_ADD_NODE_SUMMARY:-true}

      # Concurrency Settings
      - CPU_WORKERS=${CPU_WORKERS:-2}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-10}
      - LLM_CONCURRENT_LIMIT=${LLM_CONCURRENT_LIMIT:-3}

      # Data directory inside container
      - BASE_DIR=/app/data

      # Timezone
      - TZ=${TZ:-Asia/Shanghai}

      # Disable OCR (slim version)
      - DISABLE_OCR=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5088/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - deeppdf-network

networks:
  deeppdf-network:
    driver: bridge
