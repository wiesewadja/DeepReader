[project]
name = "deeppdf-backend"
version = "1.0.0"
description = "DeepPDF Backend - FastAPI server and services"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic-settings>=2.0.0",
    "nest-asyncio>=1.6.0",
]

[tool.uv.workspace]
members = ["pageindex-lib", "deeppdf-api"]

[tool.uv.sources]
pageindex = { workspace = true }
