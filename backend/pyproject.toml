[project]
name = "deeppdf-backend"
version = "1.0.0"
description = "DeepPDF Backend - FastAPI server and services"
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic-settings>=2.0.0",

    # Data storage
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.1.0",

    # PDF processing
    "pymupdf>=1.24.0",
    "pypdf>=3.0.0",

    # LLM API
    "openai>=1.30.0",
    "tiktoken>=0.6.0",

    # Utilities
    "orjson>=3.10.0",
    "backoff>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",

    # Concurrency control
    "aiofiles>=23.2.1",
    "nest-asyncio>=1.6.0",

    # Internal dependencies
    "pageindex",
]

[tool.uv.workspace]
members = ["pageindex-lib", "deeppdf-api"]

[tool.uv.sources]
pageindex = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.25.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]
