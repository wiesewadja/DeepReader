version: "3.8"

services:
  deeppdf-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: deeppdf-backend
    image: deeppdf-backend:latest
    ports:
      - "5088:5088"
    environment:
      # LLM Configuration
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}

      # PDF Indexing Configuration
      - PDF_INDEX_TOC_CHECK_PAGES=${PDF_INDEX_TOC_CHECK_PAGES:-20}
      - PDF_INDEX_MAX_PAGES_PER_NODE=${PDF_INDEX_MAX_PAGES_PER_NODE:-10}
      - PDF_INDEX_MAX_TOKENS_PER_NODE=${PDF_INDEX_MAX_TOKENS_PER_NODE:-20000}
      - PDF_INDEX_IF_ADD_NODE_SUMMARY=${PDF_INDEX_IF_ADD_NODE_SUMMARY:-true}

      # Concurrency Settings
      - CPU_WORKERS=${CPU_WORKERS:-2}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-10}
      - LLM_CONCURRENT_LIMIT=${LLM_CONCURRENT_LIMIT:-3}

      # Data directory inside container
      - BASE_DIR=/app/data

      # Timezone
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      # Persistent storage for ChromaDB and indexes
      - ./data:/app/data
      # Logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5088/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    # DNS configuration (useful in some cloud environments)
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Security options
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem for security
    read_only: true
    # Temporary filesystems for writable areas
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    networks:
      - deeppdf-network

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: deeppdf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      deeppdf-backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - deeppdf-network
    profiles:
      - with-nginx

networks:
  deeppdf-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
