version: "3.8"

services:
  deeppdf-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: deeppdf-backend
    image: deeppdf-backend:latest
    ports:
      - "5088:5088"
    environment:
      # LLM Configuration (set your API keys here or use .env file)
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      
      # PDF Indexing Configuration
      - PDF_INDEX_TOC_CHECK_PAGES=${PDF_INDEX_TOC_CHECK_PAGES:-20}
      - PDF_INDEX_MAX_PAGES_PER_NODE=${PDF_INDEX_MAX_PAGES_PER_NODE:-10}
      - PDF_INDEX_MAX_TOKENS_PER_NODE=${PDF_INDEX_MAX_TOKENS_PER_NODE:-20000}
      - PDF_INDEX_IF_ADD_NODE_SUMMARY=${PDF_INDEX_IF_ADD_NODE_SUMMARY:-true}
      
      # Concurrency Settings
      - CPU_WORKERS=${CPU_WORKERS:-2}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-10}
      - LLM_CONCURRENT_LIMIT=${LLM_CONCURRENT_LIMIT:-3}
      
      # Data directory inside container
      - BASE_DIR=/app/data
    volumes:
      # Persistent storage for ChromaDB and indexes
      - ./data:/app/data
      # Optional: mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5088/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - deeppdf-network

  # Optional: Add a reverse proxy (nginx) for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: deeppdf-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - deeppdf-backend
  #   networks:
  #     - deeppdf-network

networks:
  deeppdf-network:
    driver: bridge
