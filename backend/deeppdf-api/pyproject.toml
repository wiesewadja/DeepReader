[project]
name = "deeppdf-api"
version = "1.0.0"
description = "DeepPDF FastAPI Server - PDF indexing and semantic search"
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # Data storage
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.1.0",
    # PDF processing
    "pymupdf>=1.24.0",
    "pypdf>=3.0.0",
    # LLM API
    "openai>=1.30.0",
    "tiktoken>=0.6.0",
    # Utilities
    "orjson>=3.10.0",
    "backoff>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    # Concurrency control
    "aiofiles>=23.2.1",
    # Search & NLP
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "setuptools<81",  # 避免 jieba 的 pkg_resources 弃用警告（setuptools 81+ 将完全移除 pkg_resources）
    # Internal dependencies
    "pageindex",  # workspace dependency
    "python-multipart>=0.0.21",
    "pydantic-settings>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.25.0",  # FastAPI testing
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deeppdf"]

[tool.uv.sources]
pageindex = { workspace = true }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 标记集成测试（端到端测试完整流程）",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
]
