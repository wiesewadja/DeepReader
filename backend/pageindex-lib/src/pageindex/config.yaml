# PageIndex 配置文件
# 使用 DeepSeek API 进行树状索引生成

# ============================================================
# LLM 模型配置
# ============================================================
model: "deepseek-chat"  # 默认 LLM 模型 (用于目录解析、摘要生成等)

# LLM 调用参数
llm_temperature: 0  # LLM 温度参数 (0-2，越低越确定)
llm_max_retries: 10  # LLM 调用失败时的最大重试次数
llm_timeout: 300  # LLM API 请求超时时间 (秒)

# ============================================================
# Token 计数模型配置
# ============================================================
# 用于 PDF 解析时计算页面 token 数量
# 注意: 只使用 tiktoken 本地计算，不需要 API key
token_model: "gpt-4o"  # Token 计数模型 (gpt-4o, gpt-4, gpt-3.5-turbo 等)

# ============================================================
# PDF 解析配置
# ============================================================
toc_check_page_num: 20  # TOC 检查页数（查找目录页的范围）
max_page_num_each_node: 10  # 每节点最大页数
max_token_num_each_node: 20000  # 每节点最大 token 数

# 页面分组配置（用于处理大文档）
page_group_max_tokens: 20000  # 页面分组时每组最大 token 数
page_group_overlap_pages: 1  # 页面分组时的重叠页数

# ============================================================
# 节点内容配置
# ============================================================
if_add_node_id: "yes"  # 添加节点 ID
if_add_node_summary: "yes"  # 添加节点摘要（需要 LLM）
if_add_doc_description: "no"  # 添加文档描述
if_add_node_text: "yes"  # 添加节点文本内容
format_text_with_llm: "yes"  # 是否用 LLM 格式化文本（同时生成摘要，减少 API 调用）

# ============================================================
# LLM Provider 配置
# ============================================================
llm_provider:
  type: "deepseek"  # Provider 类型 (deepseek, openai, google, custom)
  api_key: null  # API 密钥 (null 表示从环境变量读取)
  base_url: "https://api.deepseek.com"  # API 端点
  model_param: "model"  # 模型参数名
  timeout: null  # API 请求超时 (秒，null 表示使用配置文件的 llm_timeout)
