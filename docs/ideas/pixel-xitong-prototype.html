<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>奚童表情 · 极简方案</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  color: #e0d6c8;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; padding: 40px 20px;
}
h1 { font-size: 20px; margin-bottom: 6px; color: #c9b896; letter-spacing: 2px; }
.subtitle { font-size: 13px; color: #887a6a; margin-bottom: 36px; }

.grid {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 16px; max-width: 560px; margin-bottom: 40px;
}
.face-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.face-wrap {
  width: 64px; height: 64px;
  background: #0f0f1a;
  border-radius: 8px;
  border: 1px solid #2a2a4a;
  display: flex; align-items: center; justify-content: center;
  image-rendering: pixelated;
}
.face-wrap svg { image-rendering: pixelated; }
.face-label { font-size: 10px; color: #887a6a; }

/* ===== Topbar Preview ===== */
.topbar-preview { margin-top: 24px; width: 100%; max-width: 420px; }
.topbar-preview-title { font-size: 12px; color: #6a6058; margin-bottom: 12px; text-align: center; }
.topbar-mock {
  background: #1e1e2e;
  border: 1px solid #3a3a5a;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; min-height: 52px;
}
.topbar-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.book-icon { width: 24px; height: 24px; border-radius: 4px; background: #2a2a4a; display: flex; align-items: center; justify-content: center; }
.book-title { font-size: 12px; color: #c9b896; }
.book-author { font-size: 10px; color: #6a6058; }
.topbar-center {
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto; padding: 0 8px; cursor: pointer; position: relative;
}
.mascot-face {
  width: 28px; height: 28px;
  image-rendering: pixelated;
  transition: transform 0.15s;
}
.mascot-face:hover { transform: scale(1.2); }
.mascot-face svg { width: 100%; height: 100%; image-rendering: pixelated; }
.bubble {
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  background: #2a2a4a; border: 1px solid #4a4a6a; border-radius: 5px;
  padding: 3px 8px; font-size: 10px; color: #c9b896; white-space: nowrap;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; margin-bottom: 4px;
}
.bubble::after {
  content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
  border: 3px solid transparent; border-top-color: #2a2a4a;
}
.topbar-center:hover .bubble { opacity: 1; }
.topbar-right { display: flex; gap: 6px; }
.bar-btn {
  width: 24px; height: 24px; border-radius: 4px;
  background: #2a2a4a; border: none; cursor: pointer;
  color: #887a6a; font-size: 14px;
}

.desc { font-size: 11px; color: #6a6058; margin-top: 32px; text-align: center; line-height: 1.8; max-width: 400px; }
</style>
</head>
<body>

<h1>奚童表情 · 极简方案</h1>
<p class="subtitle">10×10 像素 · 纯表情 · SVG 内联</p>

<div class="grid" id="face-grid"></div>

<div class="topbar-preview">
  <div class="topbar-preview-title">Topbar 预览 · 点击表情切换状态</div>
  <div class="topbar-mock">
    <div class="topbar-left">
      <div class="book-icon"><svg viewBox="0 0 16 16" fill="none"><rect x="3" y="2" width="10" height="12" rx="1" stroke="#6a6058" stroke-width="1"/><line x1="8" y1="4" x2="8" y2="12" stroke="#6a6058" stroke-width="0.5"/></svg></div>
      <div class="book-info"><div class="book-title">如何阅读一本书</div><div class="book-author">莫提默·艾德勒</div></div>
    </div>
    <div class="topbar-center" id="topbar-face">
      <div class="mascot-face" id="bar-face"></div>
      <div class="bubble">闲着呢~</div>
    </div>
    <div class="topbar-right">
      <button class="bar-btn">📚</button>
      <button class="bar-btn">⚙</button>
    </div>
  </div>
</div>

<div class="desc">
  10×10 像素 · 每个表情仅 ~20 个 rect<br>
  状态驱动：idle / thinking / happy / curious / reading / sleeping<br>
  实现：单个 SVG 内联元素，JS 替换 innerHTML 切换表情
</div>

<script>
// Color codes
const C = {
  bg: 'transparent',     // 0
  outline: '#1a1210',    // 1
  skin: '#e8c89e',       // 2
  skinDark: '#c9a87a',   // 3
  eye: '#1a1210',        // 4
  eyeWhite: '#f5f0e8',   // 5
  blush: '#e8a0a0',      // 6
  mouth: '#c4886a',      // 7
  mouthDark: '#8b5e3c',  // 8
  highlight: '#f5dfc0',  // 9
};

// 10x10 pixel faces
// Each row is a string of digits 0-9
const FACES = {
  idle: [
    '0111111110',
    '1222222210',
    '1222222210',
    '1222222210',
    '1245224520',
    '1245224520',
    '1222222210',
    '1227222210',
    '1622222610',
    '0111111110',
  ],

  thinking: [
    '0111111110',
    '1922222910',
    '1222222210',
    '1222222210',
    '1245224520',
    '1224222420',
    '1222222210',
    '0222082200',
    '0222222200',
    '0011111100',
  ],

  happy: [
    '0111111110',
    '1222222210',
    '1222222210',
    '1222222210',
    '1241221420',
    '1224122420',
    '1222222210',
    '1288888210',
    '1622222610',
    '0111111110',
  ],

  curious: [
    '0111111110',
    '1222222210',
    '1222222210',
    '1222222210',
    '1245224520',
    '1245224520',
    '1222222210',
    '1228222210',
    '1222222210',
    '0111111110',
  ],

  reading: [
    '0111111110',
    '1222222210',
    '1223223210',
    '1245224520',
    '1245224520',
    '1333333310',
    '1222222210',
    '1222822210',
    '1222222210',
    '0111111110',
  ],

  sleeping: [
    '0111111110',
    '1222222210',
    '1222222210',
    '1222222210',
    '1244224420',
    '1224224220',
    '1222222210',
    '1222222210',
    '1222222210',
    '0111111110',
  ],
};

const META = {
  idle:     { label: '闲读',   text: '闲着呢~' },
  thinking: { label: '思考',   text: '让我想想…' },
  happy:    { label: '愉悦',   text: '读到了好东西！' },
  curious:  { label: '好奇',   text: '嗯？' },
  reading:  { label: '深读',   text: '在读第三章…' },
  sleeping: { label: '打盹',   text: 'Zzz…' },
};

function faceSVG(data) {
  let rects = '';
  for (let y = 0; y < data.length; y++) {
    for (let x = 0; x < data[y].length; x++) {
      const c = parseInt(data[y][x]);
      if (c === 0) continue;
      const colors = [C.bg, C.outline, C.skin, C.skinDark, C.eye, C.eyeWhite, C.blush, C.mouth, C.mouthDark, C.highlight];
      rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${colors[c]}"/>`;
    }
  }
  return `<svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg" style="image-rendering:pixelated">${rects}</svg>`;
}

// Render grid
const faceGrid = document.getElementById('face-grid');
Object.entries(FACES).forEach(([state, data]) => {
  const card = document.createElement('div');
  card.className = 'face-card';
  card.innerHTML = `
    <div class="face-wrap">${faceSVG(data)}</div>
    <div class="face-label">${META[state].label}</div>
  `;
  faceGrid.appendChild(card);
});

// Topbar interactive
const barFace = document.getElementById('bar-face');
const topbarFace = document.getElementById('topbar-face');
const bubbleEl = topbarFace.querySelector('.bubble');
const states = Object.keys(FACES);
let idx = 0;

barFace.innerHTML = faceSVG(FACES.idle);

topbarFace.addEventListener('click', () => {
  idx = (idx + 1) % states.length;
  const state = states[idx];
  barFace.innerHTML = faceSVG(FACES[state]);
  bubbleEl.textContent = META[state].text;
  bubbleEl.style.opacity = '1';
  setTimeout(() => { bubbleEl.style.opacity = ''; }, 1500);
});
</script>

</body>
</html>
